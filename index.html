<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>12-Channel Smart Lighting Control Center</title>
    <!-- Paho MQTT Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js" type="text/javascript"></script>
    <!-- Google Fonts & FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-color: #0b132b;
            --card-bg: #1c2541;
            --card-inner: #0f172a;
            --text-main: #ffffff;
            --text-sub: #94a3b8;
            --accent-cyan: #38bdf8;
            --accent-green: #22c55e;
            --accent-red: #ef4444;
            --accent-amber: #f59e0b;
            --border-color: #334155;
            --switch-off: #475569;
        }

        * {
            box-sizing: border-box;
            font-family: 'Prompt', sans-serif;
            margin: 0;
            padding: 0;
            transition: all 0.2s ease-in-out;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 20px 10px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 1000px;
        }

        /* Top Header */
        .top-header {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 20px 24px;
            border-radius: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .top-header h1 {
            font-size: 20px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .connection-status {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            padding: 6px 14px;
            border-radius: 20px;
            background: rgba(239, 68, 68, 0.1);
            color: var(--accent-red);
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        .connection-status.connected {
            background: rgba(34, 197, 94, 0.1);
            color: var(--accent-green);
            border: 1px solid rgba(34, 197, 94, 0.3);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: var(--accent-red);
        }

        .connection-status.connected .status-dot {
            background-color: var(--accent-green);
            box-shadow: 0 0 8px var(--accent-green);
        }

        /* Layout Grid */
        .main-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }

        @media (min-width: 850px) {
            .main-grid {
                grid-template-columns: 340px 1fr;
            }
        }

        /* Cards Base */
        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .card-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: var(--accent-cyan);
        }

        /* System Mode Selector */
        .mode-select-box {
            background: var(--card-inner);
            padding: 12px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            margin-bottom: 15px;
        }

        .mode-select-box select {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            background: var(--card-bg);
            color: #fff;
            border: 1px solid var(--border-color);
            font-size: 15px;
            outline: none;
            cursor: pointer;
        }

        /* Timer Section */
        .timer-block {
            background: var(--card-inner);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 15px;
            margin-bottom: 15px;
        }

        .timer-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .timer-title {
            font-size: 14px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .time-input-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .time-box {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .time-box label {
            font-size: 11px;
            color: var(--text-sub);
        }

        .time-box input[type="time"] {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: #fff;
            padding: 8px;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            width: 100%;
        }

        /* Toggle Switch UI Component */
        .toggle-switch {
            position: relative;
            width: 44px;
            height: 24px;
            display: inline-block;
        }

        .toggle-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: var(--switch-off);
            border-radius: 34px;
            transition: 0.3s;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 3px;
            background-color: #fff;
            border-radius: 50%;
            transition: 0.3s;
        }

        input:checked + .slider {
            background-color: var(--accent-green);
        }

        input:checked + .slider:before {
            transform: translateX(20px);
        }

        /* 12-Switches Grid Display */
        .switches-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 12px;
        }

        .switch-card {
            background: var(--card-inner);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: 12px;
        }

        .switch-card-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .switch-icon-title {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .switch-icon-title i {
            font-size: 18px;
            color: var(--text-sub);
        }

        .switch-card.active .switch-icon-title i {
            color: var(--accent-amber);
            filter: drop-shadow(0 0 6px rgba(245, 158, 11, 0.6));
        }

        .switch-card-bottom {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid rgba(255,255,255,0.05);
            padding-top: 10px;
        }

        .status-badge {
            font-size: 11px;
            padding: 3px 8px;
            border-radius: 6px;
            background: rgba(148, 163, 184, 0.1);
            color: var(--text-sub);
        }

        .switch-card.active .status-badge {
            background: rgba(34, 197, 94, 0.15);
            color: var(--accent-green);
        }

        .btn-save-timer {
            width: 100%;
            padding: 12px;
            background: var(--accent-cyan);
            color: #000;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
        }

        .btn-save-timer:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Top Navigation / Status Header -->
        <div class="top-header">
            <h1><i class="fa-solid fa-lightbulb"></i> ระบบควบคุมไฟ 12 สวิตช์ (48 โคม)</h1>
            <div id="connectionStatus" class="connection-status">
                <span class="status-dot"></span>
                <span id="statusText">Disconnected</span>
            </div>
        </div>

        <div class="main-grid">
            <!-- Left Side: Configuration & Timer Panel -->
            <div class="left-panel">
                
                <!-- Mode Panel -->
                <div class="card">
                    <div class="card-title">
                        <span><i class="fa-solid fa-sliders"></i> โหมดการทำงานหลัก</span>
                    </div>
                    <div class="mode-select-box">
                        <select id="sysMode" onchange="changeSystemMode()">
                            <option value="MANUAL">MANUAL (สั่งงานอิสระ)</option>
                            <option value="AUTO">AUTO (ทำงานตามตั้งเวลา)</option>
                        </select>
                    </div>
                </div>

                <!-- Dual Timer Panel -->
                <div class="card">
                    <div class="card-title">
                        <span><i class="fa-regular fa-clock"></i> ตั้งเวลา AUTO</span>
                    </div>

                    <!-- Timer 1 -->
                    <div class="timer-block">
                        <div class="timer-header">
                            <span class="timer-title"><i class="fa-solid fa-1"></i> ช่วงเวลาที่ 1</span>
                            <label class="toggle-switch">
                                <input type="checkbox" id="t1_enable" onchange="toggleTimerEnable(1)">
                                <span class="slider"></span>
                            </label>
                        </div>
                        <div class="time-input-group">
                            <div class="time-box">
                                <label>เวลาเปิด (ON)</label>
                                <input type="time" id="t1_on" value="17:30">
                            </div>
                            <div class="time-box">
                                <label>เวลาปิด (OFF)</label>
                                <input type="time" id="t1_off" value="07:00">
                            </div>
                        </div>
                    </div>

                    <!-- Timer 2 (แทรกเวลา) -->
                    <div class="timer-block">
                        <div class="timer-header">
                            <span class="timer-title"><i class="fa-solid fa-2"></i> ช่วงเวลาที่ 2 (แทรก)</span>
                            <label class="toggle-switch">
                                <input type="checkbox" id="t2_enable" onchange="toggleTimerEnable(2)">
                                <span class="slider"></span>
                            </label>
                        </div>
                        <div class="time-input-group">
                            <div class="time-box">
                                <label>เวลาเปิด (ON)</label>
                                <input type="time" id="t2_on" value="12:00">
                            </div>
                            <div class="time-box">
                                <label>เวลาปิด (OFF)</label>
                                <input type="time" id="t2_off" value="13:00">
                            </div>
                        </div>
                    </div>

                    <button class="btn-save-timer" onclick="saveTimerSettings()"><i class="fa-solid fa-floppy-disk"></i> บันทึกการตั้งเวลา</button>
                </div>

            </div>

            <!-- Right Side: 12 Switches Control Panel -->
            <div class="right-panel">
                <div class="card">
                    <div class="card-title">
                        <span><i class="fa-solid fa-grip"></i> แผงสวิตช์ควบคุม (12 แชนแนล)</span>
                        <span id="currentModeBadge" style="font-size: 12px; color: var(--accent-cyan);">MANUAL MODE</span>
                    </div>

                    <!-- 12 Switches Grid -->
                    <div class="switches-grid" id="switchesContainer">
                        <!-- Dynamic JavaScript Rendered Switches Here -->
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script>
        // MQTT Connection Parameters
        const hostname = "5796ce96006345e49d2690db778b2ebb.s1.eu.hivemq.cloud";
        const port = 8884;
        const username = "UTTbkk";
        const password = "tbkk1234";
        const clientId = "WebClient-12Ch-" + Math.random().toString(36).substring(2, 8);

        const client = new Paho.MQTT.Client(hostname, port, clientId);

        // State Array for 12 Switches
        let switchesState = new Array(12).fill(false);
        let currentSystemMode = "MANUAL";

        // Initial Dynamic Build 12 Switches UI
        function initSwitchesUI() {
            const container = document.getElementById("switchesContainer");
            container.innerHTML = "";

            for (let i = 1; i <= 12; i++) {
                const switchHtml = `
                    <div class="switch-card" id="card-sw-${i}">
                        <div class="switch-card-top">
                            <div class="switch-icon-title">
                                <i class="fa-solid fa-lightbulb"></i>
                                <span style="font-size: 14px; font-weight: 500;">สวิตช์ ${i}</span>
                            </div>
                        </div>
                        <div class="switch-card-bottom">
                            <span class="status-badge" id="badge-sw-${i}">OFF</span>
                            <label class="toggle-switch">
                                <input type="checkbox" id="sw-${i}" onchange="onSwitchToggle(${i}, this.checked)">
                                <span class="slider"></span>
                            </label>
                        </div>
                    </div>
                `;
                container.innerHTML += switchHtml;
            }
        }

        // Initialize App
        initSwitchesUI();
        connectMQTT();

        function connectMQTT() {
            client.onConnectionLost = onConnectionLost;
            client.onMessageArrived = onMessageArrived;

            client.connect({
                onSuccess: onConnect,
                onFailure: onFailure,
                userName: username,
                password: password,
                useSSL: true,
                keepAliveInterval: 30
            });
        }

        function onConnect() {
            updateStatusUI(true, "Connected");
            
            // Subscribe to Master Control & Status Topics
            client.subscribe("home12/mode");
            client.subscribe("home12/timer");
            client.subscribe("home12/status"); // Subscribes JSON Status from ESP32
        }

        function onFailure(err) {
            updateStatusUI(false, "Connecting...");
            setTimeout(connectMQTT, 4000);
        }

        function onConnectionLost(response) {
            updateStatusUI(false, "Disconnected");
            setTimeout(connectMQTT, 4000);
        }

        // Handle Incoming MQTT Messages
        function onMessageArrived(message) {
            const topic = message.destinationName;
            const payload = message.payloadString;

            try {
                if (topic === "home12/mode") {
                    currentSystemMode = payload;
                    document.getElementById("sysMode").value = payload;
                    applyModeUIStatus(payload);
                } 
                else if (topic === "home12/timer") {
                    const tData = JSON.parse(payload);
                    document.getElementById("t1_enable").checked = tData.t1_en;
                    document.getElementById("t1_on").value = tData.t1_on;
                    document.getElementById("t1_off").value = tData.t1_off;

                    document.getElementById("t2_enable").checked = tData.t2_en;
                    document.getElementById("t2_on").value = tData.t2_on;
                    document.getElementById("t2_off").value = tData.t2_off;
                }
                else if (topic === "home12/status") {
                    // Update real-time hardware button & relay states array from ESP32
                    const states = JSON.parse(payload); // Expecting [0,1,0,0,1,...]
                    for (let i = 0; i < 12; i++) {
                        updateSingleSwitchUI(i + 1, states[i] === 1);
                    }
                }
            } catch (e) {
                console.error("MQTT Parsing Error:", e);
            }
        }

        // User Action Handlers
        function onSwitchToggle(ch, isChecked) {
            switchesState[ch - 1] = isChecked;
            publishMQTT("home12/control", JSON.stringify({ channel: ch, state: isChecked ? 1 : 0 }));
        }

        function changeSystemMode() {
            const mode = document.getElementById("sysMode").value;
            publishMQTT("home12/mode", mode, true);
            applyModeUIStatus(mode);
        }

        function saveTimerSettings() {
            const timerPayload = {
                t1_en: document.getElementById("t1_enable").checked,
                t1_on: document.getElementById("t1_on").value,
                t1_off: document.getElementById("t1_off").value,
                t2_en: document.getElementById("t2_enable").checked,
                t2_on: document.getElementById("t2_on").value,
                t2_off: document.getElementById("t2_off").value
            };
            publishMQTT("home12/timer", JSON.stringify(timerPayload), true);
            alert("บันทึกการตั้งเวลาเรียบร้อยแล้ว!");
        }

        function applyModeUIStatus(mode) {
            const isAuto = (mode === "AUTO");
            document.getElementById("currentModeBadge").innerText = mode + " MODE";
            document.getElementById("currentModeBadge").style.color = isAuto ? "var(--accent-green)" : "var(--accent-cyan)";

            // Disable manual switches when system in AUTO mode
            for (let i = 1; i <= 12; i++) {
                document.getElementById(`sw-${i}`).disabled = isAuto;
            }
        }

        function updateSingleSwitchUI(ch, isOn) {
            const card = document.getElementById(`card-sw-${ch}`);
            const badge = document.getElementById(`badge-sw-${ch}`);
            const input = document.getElementById(`sw-${ch}`);

            input.checked = isOn;
            if (isOn) {
                card.classList.add("active");
                badge.innerText = "ON";
            } else {
                card.classList.remove("active");
                badge.innerText = "OFF";
            }
        }

        function publishMQTT(topic, payload, retain = false) {
            if (client.isConnected()) {
                const msg = new Paho.MQTT.Message(payload);
                msg.destinationName = topic;
                msg.retained = retain;
                client.send(msg);
            }
        }

        function updateStatusUI(isConnected, text) {
            const statusDiv = document.getElementById("connectionStatus");
            const statusText = document.getElementById("statusText");

            statusText.innerText = text;
            if (isConnected) {
                statusDiv.classList.add("connected");
            } else {
                statusDiv.classList.remove("connected");
            }
        }
    </script>
</body>
</html>
