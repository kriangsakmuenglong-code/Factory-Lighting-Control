<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Factory Lighting Control</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background: #f4f4f9; padding: 20px; }
        .card { background: white; padding: 20px; border-radius: 12px; max-width: 400px; margin: auto; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        .btn { width: 100%; padding: 12px; margin: 8px 0; border: none; border-radius: 6px; font-size: 16px; cursor: pointer; }
        .btn-auto { background: #007bff; color: white; }
        .btn-on { background: #28a745; color: white; }
        .btn-off { background: #dc3545; color: white; }
        .status-box { padding: 15px; margin-top: 15px; font-weight: bold; border-radius: 6px; }
        .status-on { background: #d4edda; color: #155724; }
        .status-off { background: #f8d7da; color: #721c24; }
    </style>
</head>
<body>
    <div class="card">
        <h2>ควบคุมไฟแสงสว่างโรงงาน</h2>
        <button class="btn btn-auto" onclick="setMode(0)">โหมด AUTO (ตามเวลา)</button>
        <button class="btn btn-on" onclick="setMode(1)">โหมด MANUAL (เปิดไฟ)</button>
        <button class="btn btn-off" onclick="setMode(2)">โหมด MANUAL (ปิดไฟ)</button>
        
        <div id="status" class="status-box status-off">สถานะไฟ: OFF</div>
    </div>

    <script>
        // กำหนดค่าการเชื่อมต่อ HiveMQ WebSocket
        const broker = "xxxxxxxx.s1.eu.hivemq.cloud";
        const port = 8884; // WebSocket Port
        const clientID = "web_client_" + Math.random().toString(16).substr(2, 8);
        
        const client = new Paho.MQTT.Client(broker, port, clientID);

        client.onMessageArrived = function(message) {
            if(message.destinationName === "factory/lighting/status") {
                const statusDiv = document.getElementById("status");
                if(message.payloadString === "ON") {
                    statusDiv.innerText = "สถานะไฟ: ON (เปิดอยู่)";
                    statusDiv.className = "status-box status-on";
                } else {
                    statusDiv.innerText = "สถานะไฟ: OFF (ปิดอยู่)";
                    statusDiv.className = "status-box status-off";
                }
            }
        };

        client.connect({
            useSSL: true,
            userName: "YOUR_USERNAME",
            password: "YOUR_PASSWORD",
            onSuccess: function() {
                console.log("Connected");
                client.subscribe("factory/lighting/status");
            }
        });

        function setMode(mode) {
            const message = new Paho.MQTT.Message(mode.toString());
            message.destinationName = "factory/lighting/mode/set";
            client.send(message);
        }
    </script>
</body>
</html>
