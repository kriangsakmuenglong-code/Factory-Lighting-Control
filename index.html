<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Switch Control System</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }

    /* System Header */
    .app-header {
      text-align: center;
      margin-top: 20px;
      margin-bottom: 25px;
    }

    .app-header h1 {
      font-size: 2rem;
      color: #38bdf8;
      font-weight: 700;
    }

    .app-header p {
      color: #94a3b8;
      margin-top: 5px;
    }

    /* Views Logic */
    .view {
      display: none;
      width: 100%;
      max-width: 1000px;
      animation: fadeIn 0.3s ease-in-out;
    }

    .view.active {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* --- PAGE 1: ZONE & MODE SELECTOR --- */
    .mode-selection-box {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 15px 25px;
      max-width: 500px;
      margin: 0 auto 30px auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .mode-label {
      font-size: 1.1rem;
      font-weight: 600;
      color: #f8fafc;
    }

    .mode-switch-group {
      display: flex;
      background-color: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 4px;
      gap: 5px;
    }

    .mode-btn {
      background: transparent;
      border: none;
      color: #94a3b8;
      padding: 8px 20px;
      border-radius: 6px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }

    .mode-btn.active-auto {
      background-color: #0284c7;
      color: #ffffff;
      box-shadow: 0 2px 8px rgba(2, 132, 199, 0.4);
    }

    .mode-btn.active-manual {
      background-color: #eab308;
      color: #0f172a;
      box-shadow: 0 2px 8px rgba(234, 179, 8, 0.4);
    }

    .zone-container {
      display: flex;
      gap: 25px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .zone-card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 30px;
      width: 380px;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .zone-card:hover {
      transform: translateY(-8px);
      border-color: #38bdf8;
      box-shadow: 0 20px 30px -10px rgba(56, 189, 248, 0.25);
      background: #24334a;
    }

    .zone-title {
      font-size: 1.8rem;
      font-weight: 600;
      margin-bottom: 15px;
      color: #ffffff;
    }

    .zone-info {
      color: #cbd5e1;
      font-size: 1rem;
      margin-bottom: 25px;
      line-height: 1.5;
    }

    .zone-btn {
      background: linear-gradient(135deg, #0284c7, #2563eb);
      color: #ffffff;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
    }

    .zone-card.gdc .zone-btn {
      background: linear-gradient(135deg, #0d9488, #059669);
    }

    /* --- PAGE 2 & 3: SWITCH DASHBOARDS --- */
    .dashboard-topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
      padding-bottom: 15px;
      border-bottom: 1px solid #334155;
      flex-wrap: wrap;
      gap: 15px;
    }

    .back-btn {
      background-color: #334155;
      color: #f8fafc;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .back-btn:hover {
      background-color: #475569;
    }

    .zone-heading-box {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .zone-heading {
      font-size: 1.5rem;
      color: #38bdf8;
    }

    .current-mode-badge {
      font-size: 0.8rem;
      padding: 4px 10px;
      border-radius: 12px;
      font-weight: 700;
      text-transform: uppercase;
    }

    .current-mode-badge.auto {
      background-color: #0284c7;
      color: #ffffff;
    }

    .current-mode-badge.manual {
      background-color: #eab308;
      color: #0f172a;
    }

    /* Switch Grid Layout */
    .switch-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 20px;
    }

    .switch-card {
      background-color: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      transition: all 0.2s;
    }

    .switch-card.disabled {
      opacity: 0.5;
      pointer-events: none;
    }

    .switch-card.active-on {
      border-color: #22c55e;
      background-color: #14291f;
    }

    .switch-name {
      font-size: 1.25rem;
      font-weight: 700;
      color: #ffffff;
    }

    .switch-status {
      font-size: 0.85rem;
      font-weight: 600;
      color: #94a3b8;
      text-transform: uppercase;
    }

    .switch-card.active-on .switch-status {
      color: #4ade80;
    }

    /* UI Toggle Switch Button */
    .toggle-container {
      position: relative;
      display: inline-block;
      width: 60px;
      height: 32px;
    }

    .toggle-container input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #475569;
      transition: .3s;
      border-radius: 32px;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 24px;
      width: 24px;
      left: 4px;
      bottom: 4px;
      background-color: white;
      transition: .3s;
      border-radius: 50%;
    }

    input:checked + .slider {
      background-color: #22c55e;
    }

    input:checked + .slider:before {
      transform: translateX(28px);
    }

    @media (max-width: 600px) {
      .switch-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="app-header">
    <h1>Switch Control System</h1>
    <p>ระบบควบคุมสวิตช์ไฟแสงสว่างพื้นที่ FACTORY2 EXTENSION</p>
  </div>

  <!-- VIEW 1: PAGE HOME (MODE & ZONE SELECTOR) -->
  <div id="view-home" class="view active">
    
    <!-- Global Mode Selector Box -->
    <div class="mode-selection-box">
      <span class="mode-label">โหมดการทำงานระบบ:</span>
      <div class="mode-switch-group">
        <button class="mode-btn active-auto" id="btn-global-auto" onclick="setGlobalMode('AUTO')">AUTO</button>
        <button class="mode-btn" id="btn-global-manual" onclick="setGlobalMode('MANUAL')">MANUAL</button>
      </div>
    </div>

    <!-- Zone Cards Container -->
    <div class="zone-container">
      
      <!-- Card PD3 and SCM -->
      <div class="zone-card" onclick="switchView('view-pd3-scm')">
        <div>
          <h2 class="zone-title">PD3 and SCM</h2>
          <p class="zone-info">โซนการทำงาน PD3 & SCM</p>
        </div>
        <button class="zone-btn">เข้าสู่หน้าควบคุม</button>
      </div>

      <!-- Card Zone GDC -->
      <div class="zone-card gdc" onclick="switchView('view-gdc')">
        <div>
          <h2 class="zone-title">Zone GDC</h2>
          <p class="zone-info">โซนการทำงาน GDC</p>
        </div>
        <button class="zone-btn">เข้าสู่หน้าควบคุม</button>
      </div>

    </div>
  </div>

  <!-- VIEW 2: PD3 AND SCM CONTROL -->
  <div id="view-pd3-scm" class="view">
    <div class="dashboard-topbar">
      <button class="back-btn" onclick="switchView('view-home')">← ย้อนกลับหน้าแรก</button>
      <div class="zone-heading-box">
        <h2 class="zone-heading">โซน: PD3 and SCM</h2>
        <span class="current-mode-badge auto" id="badge-pd3">AUTO</span>
      </div>
    </div>
    
    <div class="switch-grid" id="grid-pd3-scm">
      <!-- Generated Switches A-L by JS -->
    </div>
  </div>

  <!-- VIEW 3: GDC CONTROL -->
  <div id="view-gdc" class="view">
    <div class="dashboard-topbar">
      <button class="back-btn" onclick="switchView('view-home')">← ย้อนกลับหน้าแรก</button>
      <div class="zone-heading-box">
        <h2 class="zone-heading">โซน: Zone GDC</h2>
        <span class="current-mode-badge auto" id="badge-gdc">AUTO</span>
      </div>
    </div>

    <div class="switch-grid" id="grid-gdc">
      <!-- Generated Switches M-U by JS -->
    </div>
  </div>

  <script>
    const pd3ScmSwitches = ['A', 'B', 'C', 'D', 'E', 'F', 'G', 'H', 'I', 'J', 'K', 'L'];
    const gdcSwitches = ['M', 'N', 'O', 'P', 'Q', 'R', 'S', 'T', 'U'];

    // Current System Mode State
    let currentGlobalMode = 'AUTO';

    function switchView(viewId) {
      document.querySelectorAll('.view').forEach(view => {
        view.classList.remove('active');
      });
      document.getElementById(viewId).classList.add('active');
    }

    // Set System Mode (AUTO / MANUAL)
    function setGlobalMode(mode) {
      currentGlobalMode = mode;
      
      const autoBtn = document.getElementById('btn-global-auto');
      const manualBtn = document.getElementById('btn-global-manual');
      const badgePd3 = document.getElementById('badge-pd3');
      const badgeGdc = document.getElementById('badge-gdc');

      if (mode === 'AUTO') {
        autoBtn.className = 'mode-btn active-auto';
        manualBtn.className = 'mode-btn';

        badgePd3.className = 'current-mode-badge auto';
        badgePd3.innerText = 'AUTO';
        badgeGdc.className = 'current-mode-badge auto';
        badgeGdc.innerText = 'AUTO';

        // Lock switches for AUTO mode
        pd3ScmSwitches.concat(gdcSwitches).forEach(name => {
          document.getElementById(`card-switch-${name}`).classList.add('disabled');
        });
      } else {
        autoBtn.className = 'mode-btn';
        manualBtn.className = 'mode-btn active-manual';

        badgePd3.className = 'current-mode-badge manual';
        badgePd3.innerText = 'MANUAL';
        badgeGdc.className = 'current-mode-badge manual';
        badgeGdc.innerText = 'MANUAL';

        // Unlock switches for MANUAL mode
        pd3ScmSwitches.concat(gdcSwitches).forEach(name => {
          document.getElementById(`card-switch-${name}`).classList.remove('disabled');
        });
      }

      console.log(`Global System Mode updated to: ${mode}`);
    }

    // Render Switch Cards UI
    function renderSwitches(switchList, containerId) {
      const container = document.getElementById(containerId);
      container.innerHTML = '';

      switchList.forEach(name => {
        const card = document.createElement('div');
        card.className = 'switch-card disabled'; // Default AUTO mode locks manual switches
        card.id = `card-switch-${name}`;

        card.innerHTML = `
          <div class="switch-name">สวิตช์ ${name}</div>
          <div class="switch-status" id="status-${name}">OFF</div>
          <label class="toggle-container">
            <input type="checkbox" id="input-switch-${name}" onchange="toggleSwitchState('${name}', this.checked)">
            <span class="slider"></span>
          </label>
        `;
        container.appendChild(card);
      });
    }

    function toggleSwitchState(switchName, isChecked) {
      const card = document.getElementById(`card-switch-${switchName}`);
      const statusText = document.getElementById(`status-${switchName}`);

      if (isChecked) {
        card.classList.add('active-on');
        statusText.innerText = 'ON';
        console.log(`Switch ${switchName}: TURNED ON`);
      } else {
        card.classList.remove('active-on');
        statusText.innerText = 'OFF';
        console.log(`Switch ${switchName}: TURNED OFF`);
      }
    }

    // Initial Render
    renderSwitches(pd3ScmSwitches, 'grid-pd3-scm');
    renderSwitches(gdcSwitches, 'grid-gdc');
  </script>

</body>
</html>
